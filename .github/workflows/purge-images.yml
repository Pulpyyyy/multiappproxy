name: Purge Docker Hub tags

# Deleting published images is irreversible, so nothing here runs on its own:
# it is dispatched by hand, the pattern has no default, and the first run is a
# dry run unless explicitly told otherwise.

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Regex matching the tags to delete (e.g. ^1\.3\.[1-9]$)'
        required: true
      keep:
        description: 'Comma-separated tags to keep even when matched'
        required: false
        default: ''
      dry_run:
        description: 'List what would be deleted without deleting it'
        required: true
        type: boolean
        default: true

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge matching tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PATTERN: ${{ inputs.pattern }}
          KEEP: ${{ inputs.keep }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          JWT=$(curl -sS -X POST https://hub.docker.com/v2/auth/token/ \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
                  '{identifier:$u, secret:$p}')" | jq -r '.access_token // empty')

          if [ -z "$JWT" ]; then
            echo "::error::Docker Hub authentication failed"
            exit 1
          fi

          # 'latest' is the tag Home Assistant installs from: never a candidate.
          KEEP_LIST="latest${KEEP:+,$KEEP}"
          deleted=0
          skipped=0

          for repo in multiappproxy-amd64 multiappproxy-aarch64; do
            echo "── $repo"
            page=1
            tags=""
            while :; do
              body=$(curl -sS -H "Authorization: Bearer $JWT" \
                "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/$repo/tags?page_size=100&page=$page")
              names=$(echo "$body" | jq -r '.results[]?.name')
              [ -z "$names" ] && break
              tags="$tags$names"$'\n'
              [ "$(echo "$body" | jq -r '.next // empty')" = "" ] && break
              page=$((page + 1))
            done

            for tag in $tags; do
              if ! echo "$tag" | grep -qE "$PATTERN"; then continue; fi
              if echo ",$KEEP_LIST," | grep -q ",$tag,"; then
                echo "  keep    $tag"
                skipped=$((skipped + 1))
                continue
              fi
              if [ "$DRY_RUN" = "true" ]; then
                echo "  would delete $tag"
                continue
              fi
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $JWT" \
                "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/$repo/tags/$tag/")
              if [ "$code" = "204" ] || [ "$code" = "202" ]; then
                echo "  deleted $tag"
                deleted=$((deleted + 1))
              else
                echo "::warning::failed to delete $tag (HTTP $code)"
              fi
            done
          done

          echo "── $deleted deleted, $skipped kept, dry_run=$DRY_RUN"
