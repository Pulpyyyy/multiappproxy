configuration:
  debug:
    name: Debug mode
    description: Display real-time logs on the interface.
  apps:
    name: Applications
    description: List of applications to proxy.
  # --- Identity / routing ---
  apps.name:
    name: Name
    description: Application display name.
  apps.url:
    name: URL
    description: Backend application URL (http:// or https://).
  apps.path:
    name: Path
    description: Access path in the proxy (e.g., /myapp).
  # --- Display ---
  apps.description:
    name: Description
    description: Short description displayed on the card.
  apps.icon:
    name: Icon
    description: Emoji icon (e.g., 🚀).
  apps.logo:
    name: Logo
    description: Image URL (takes priority over icon).
  apps.category:
    name: Category
    description: Grouping category.
  # --- Access ---
  apps.admin:
    name: Admin only
    description: >
      When enabled, this application is hidden from non-admin users.
  apps.secret:
    name: Password
    description: >
      Password required to access this application. Leave empty to disable password protection.
  apps.token:
    name: Token
    description: Authentication token (added to query string).
  # --- Proxy behaviour ---
  apps.rewrite:
    name: URL rewrite
    description: Enable URL rewriting (deprecated, configure app-side instead).
  apps.preserve_path:
    name: Preserve path
    description: >
      Forward requests as-is without stripping the proxy path prefix.
      Required for HA addon ingress apps that already embed the full path in their URLs.
  apps.csrf_fix:
    name: CSRF fix
    description: >
      Enable for apps that validate the request origin: Django apps without HA
      ingress (e.g. NSPanel Manager) or embedded firmwares (e.g. ESPSomfy-RTS).
      Overrides the Origin, Referer and Host headers with the upstream URL so
      the app's CSRF check sees consistent values.
  apps.ws_rewrite:
    name: WebSocket rewrite
    description: >
      Enable automatic WebSocket URL rewriting. When set, a script is injected into
      HTML responses that patches window.WebSocket at runtime: any WebSocket URL
      containing /websocket/, /ws/, or /wss/ is transparently rewritten to go through
      this app's proxy path. Required for apps whose backend or JavaScript constructs
      WebSocket URLs with the wrong host or path (e.g. NSPanel Manager).
  apps.ws_target:
    name: Separate WebSocket (URL)
    description: >
      URL of the WebSocket server when the device serves it on a different port
      than HTTP (e.g. ESPSomfy-RTS: web on :80, WebSocket on :8080 →
      http://192.168.1.223:8080). The proxy then exposes it at <path>/ws:
      from an HTTPS page the browser connects over wss:// through the proxy,
      avoiding the mixed-content block of a direct ws:// to the device.
  apps.hide_csp:
    name: Hide CSP headers
    description: >
      Strips the Content-Security-Policy and X-Frame-Options headers returned
      by the application. Enable when the app forbids being displayed in an
      iframe (frame-ancestors 'none') but must render inside the Home Assistant
      ingress panel (e.g. ESPSomfy-RTS). Only affects this app.
  apps.fast_upstream:
    name: Optimise for this backend
    description: >
      Enable when the application is noticeably slower through the proxy than in
      direct access: embedded device (ESP32, firmware) or modern app serving a
      large JavaScript bundle. Re-enables response buffering so the backend's
      sockets are freed immediately, lets its own cache headers through instead
      of forcing no-store, and serves static files (js, css, fonts, images,
      audio) from a dedicated location that keeps their compression. Do not
      enable for apps that stream responses progressively (SSE, live logs),
      unless they send the X-Accel-Buffering: no header, which nginx honours.
  apps.ssl_verify:
    name: SSL verification
    description: >
      Verify the application's SSL certificate (https upstreams only) against
      the system certificate authorities. Disabled by default to accept
      self-signed certificates on the local network.
  # --- Advanced ---
  apps.hassio_ingress_slug:
    name: HA ingress slug
    description: >
      Addon slug for HA-ingress-aware apps. When set, multiappproxy resolves the
      addon's ingress token via the Supervisor API and rewrites those paths so the
      browser routes requests back through multiappproxy.
