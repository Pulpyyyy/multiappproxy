configuration:
  debug:
    name: Modo de depuração
    description: Exibir logs em tempo real na interface.
  autodetect:
    name: Deteção automática
    description: >
      Valor por omissão da deteção automática para todas as aplicações. Pode ser
      substituído por aplicação.
  apps:
    name: Aplicações
    description: Lista de aplicações para proxy.
  apps.name:
    name: Nome
    description: Nome de exibição da aplicação.
  apps.url:
    name: URL
    description: URL backend da aplicação (http:// ou https://).
  apps.path:
    name: Caminho
    description: >
      Obsoleto e ignorado: o caminho é derivado do nome da aplicação. Mantido
      apenas para que as configurações antigas ainda arranquem.
  apps.entry_path:
    name: Ponto de entrada
    description: >
      Caminho interno para onde enviar o navegador ao abrir (ex. /ui/dashboard).
      Útil para apps que respondem à sua raiz com um redirecionamento: o ingress
      do HA segue-o sozinho, o navegador fica no caminho do proxy, e as apps que
      deduzem o prefixo a partir do URL erram. Detetado automaticamente na
      maioria dos casos.
  apps.description:
    name: Descrição
    description: Breve descrição exibida no cartão.
  apps.icon:
    name: Ícone
    description: Ícone emoji (ex. 🚀).
  apps.logo:
    name: Logo
    description: URL da imagem (tem prioridade sobre o ícone).
  apps.category:
    name: Categoria
    description: Categoria de agrupamento.
  apps.token:
    name: Token
    description: Token de autenticação (adicionado à query string).
  apps.rewrite:
    name: Reescrita de URL
    description: Ativar reescrita de URL (obsoleto, configurar no lado da app).
  apps.secret:
    name: Senha
    description: >
      Senha necessária para acessar esta aplicação. Deixar vazio para desativar a proteção por senha.
  apps.admin:
    name: Apenas admins
    description: >
      Quando ativado, esta aplicação fica oculta para utilizadores não
      administradores.
  apps.preserve_path:
    name: Preservar caminho
    description: >
      Encaminha os pedidos tal como estão, sem remover o prefixo do caminho do
      proxy. Necessário para apps com ingress HA nativo que já incluem o
      caminho completo nos seus URLs.
  apps.csrf_fix:
    name: Correção CSRF
    description: >
      Ativar para apps Django sem ingress HA (ex. NSPanel Manager) acedidas
      através do ingress do multiappproxy. Substitui os cabeçalhos Origin,
      Referer e Host pelo URL upstream para que a verificação CSRF veja
      valores correspondentes.
  apps.ws_rewrite:
    name: Reescrita WebSocket
    description: >
      Injeta um script nas respostas HTML que aplica um patch a
      window.WebSocket em tempo de execução: os URLs WebSocket são reescritos
      para passar pelo caminho proxy desta app (ex. NSPanel Manager).
  apps.hassio_ingress_slug:
    name: Slug ingress HA
    description: >
      Slug do addon para apps com ingress HA nativo. Quando definido, o
      multiappproxy resolve o token ingress do addon via API do Supervisor e
      reescreve esses caminhos para que o navegador passe pelo multiappproxy.
  apps.fast_upstream:
    name: Otimizar para este backend
    description: >
      Ative quando a aplicação está claramente mais lenta através do proxy do
      que em acesso direto: dispositivo embebido (ESP32, firmware) ou aplicação
      moderna que serve um grande bundle JavaScript. Reativa o buffering das
      respostas para libertar de imediato os sockets do backend, deixa passar os
      seus cabeçalhos de cache em vez de forçar no-store e serve os ficheiros
      estáticos (js, css, tipos de letra, imagens, áudio) a partir de uma
      location dedicada que preserva a sua compressão. Não ative em apps que
      enviam respostas em streaming (SSE, logs em direto), salvo se enviarem o
      cabeçalho X-Accel-Buffering: no, que o nginx respeita.
  apps.autodetect:
    name: Deteção automática
    description: >
      Sonda a aplicação no arranque para deduzir as opções observáveis (ponto de
      entrada, cabeçalhos CSP, verificação de origem). O que estiver na
      configuração tem sempre prioridade. Desative para fixar totalmente o
      comportamento.
  apps.ssl_verify:
    name: Verificação SSL
    description: >
      Verifica o certificado SSL do upstream (apenas https) contra as CAs do
      sistema. Desativado por padrão para aceitar certificados autoassinados
      da rede local.
  apps.ws_target:
    name: WebSocket separado (URL)
    description: >
      URL do servidor WebSocket quando o dispositivo o serve numa porta
      diferente do HTTP (ex. ESPSomfy-RTS: web em :80, WebSocket em :8080 →
      http://192.168.1.223:8080). O proxy expõe-o em <caminho>/ws — a partir de
      uma página HTTPS o navegador liga-se por wss:// através do proxy,
      evitando o bloqueio de conteúdo misto.
  apps.hide_csp:
    name: Ocultar cabeçalhos CSP
    description: >
      Remove os cabeçalhos Content-Security-Policy e X-Frame-Options devolvidos
      pela aplicação. Ativar quando a app proíbe a exibição em iframe
      (frame-ancestors 'none') mas deve aparecer no painel ingress do Home
      Assistant (ex. ESPSomfy-RTS). Afeta apenas esta app.
