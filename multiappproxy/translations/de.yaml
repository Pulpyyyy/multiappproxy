configuration:
  debug:
    name: Debug-Modus
    description: Echtzeit-Protokolle auf der Oberfläche anzeigen.
  apps:
    name: Anwendungen
    description: Liste der zu proxierenden Anwendungen.
  apps.name:
    name: Name
    description: Anzeigename der Anwendung.
  apps.url:
    name: URL
    description: Backend-URL der Anwendung (http:// oder https://).
  apps.path:
    name: Pfad
    description: Zugriffspfad im Proxy (z.B. /myapp).
  apps.description:
    name: Beschreibung
    description: Kurze Beschreibung auf der Karte angezeigt.
  apps.icon:
    name: Symbol
    description: Emoji-Symbol (z.B. 🚀).
  apps.logo:
    name: Logo
    description: Bild-URL (hat Vorrang vor Symbol).
  apps.category:
    name: Kategorie
    description: Gruppierungskategorie.
  apps.token:
    name: Token
    description: Authentifizierungs-Token (wird zur Query-String hinzugefügt).
  apps.rewrite:
    name: URL-Umschreibung
    description: URL-Umschreibung aktivieren (veraltet, auf App-Seite konfigurieren).
  apps.secret:
    name: Passwort
    description: >
      Passwort zum Zugriff auf diese Anwendung. Leer lassen, um den Passwortschutz zu deaktivieren.
  apps.admin:
    name: Nur Admins
    description: >
      Wenn aktiviert, ist diese Anwendung für Nicht-Administrator-Benutzer
      ausgeblendet.
  apps.preserve_path:
    name: Pfad beibehalten
    description: >
      Leitet Anfragen unverändert weiter, ohne das Proxy-Pfadpräfix zu entfernen.
      Erforderlich für HA-Ingress-Apps, die den vollständigen Pfad bereits in
      ihren URLs einbetten.
  apps.csrf_fix:
    name: CSRF-Korrektur
    description: >
      Für Django-Apps ohne HA-Ingress (z.B. NSPanel Manager), die über den
      multiappproxy-Ingress aufgerufen werden. Ersetzt die Header Origin,
      Referer und Host durch die Upstream-URL, damit die CSRF-Prüfung
      übereinstimmende Werte sieht.
  apps.ws_rewrite:
    name: WebSocket-Umschreibung
    description: >
      Injiziert ein Skript in HTML-Antworten, das window.WebSocket zur Laufzeit
      patcht: WebSocket-URLs werden umgeschrieben, damit sie über den Proxy-Pfad
      dieser App laufen (z.B. NSPanel Manager).
  apps.hassio_ingress_slug:
    name: HA-Ingress-Slug
    description: >
      Addon-Slug für Apps mit nativem HA-Ingress. Wenn gesetzt, löst
      multiappproxy das Ingress-Token des Addons über die Supervisor-API auf
      und schreibt diese Pfade um, damit der Browser über multiappproxy geht.
  apps.ssl_verify:
    name: SSL-Prüfung
    description: >
      Prüft das SSL-Zertifikat des Upstreams (nur https) gegen die System-CAs.
      Standardmäßig deaktiviert, um selbstsignierte Zertifikate im lokalen
      Netzwerk zu akzeptieren.
  apps.ws_target:
    name: Separater WebSocket (URL)
    description: >
      URL des WebSocket-Servers, wenn das Gerät ihn auf einem anderen Port als
      HTTP bereitstellt (z.B. ESPSomfy-RTS: Web auf :80, WebSocket auf :8080 →
      http://192.168.1.223:8080). Der Proxy stellt ihn unter <Pfad>/ws bereit —
      aus einer HTTPS-Seite verbindet sich der Browser per wss:// über den
      Proxy, ohne Mixed-Content-Blockierung.
  apps.hide_csp:
    name: CSP-Header entfernen
    description: >
      Entfernt die von der Anwendung gesendeten Header Content-Security-Policy
      und X-Frame-Options. Aktivieren, wenn die App iframes verbietet
      (frame-ancestors 'none'), aber im HA-Ingress-Panel angezeigt werden soll
      (z.B. ESPSomfy-RTS). Betrifft nur diese App.
