configuration:
  debug:
    name: Debug-Modus
    description: Echtzeit-Protokolle auf der Oberfläche anzeigen.
  autodetect:
    name: Automatische Erkennung
    description: >
      Standardwert der automatischen Erkennung für alle Anwendungen. Pro
      Anwendung überschreibbar.
  apps:
    name: Anwendungen
    description: Liste der zu proxierenden Anwendungen.
  apps.name:
    name: Name
    description: Anzeigename der Anwendung.
  apps.url:
    name: URL
    description: Backend-URL der Anwendung (http:// oder https://).
  apps.path:
    name: Pfad
    description: >
      Veraltet und ignoriert: der Pfad wird aus dem Anwendungsnamen abgeleitet.
      Nur beibehalten, damit ältere Konfigurationen noch starten.
  apps.entry_path:
    name: Einstiegspunkt
    description: >
      Interner Pfad, auf den der Browser beim Öffnen geschickt wird (z.B.
      /ui/dashboard). Nützlich für Apps, die ihre Wurzel mit einer Weiterleitung
      beantworten: HA-Ingress folgt ihr selbst, der Browser bleibt auf dem
      Proxy-Pfad, und Apps, die ihr Präfix aus der URL ableiten, liegen falsch.
      Wird meist automatisch erkannt.
  apps.native_base_path:
    name: Präfix von der Anwendung verwaltet
    description: >
      Wenn die Anwendung ihre URLs aus einem Präfix-Header aufbauen kann
      (X-Ingress-Path oder X-Forwarded-Prefix), leitet der Proxy ihn weiter und
      schreibt nichts mehr um: die App präfigiert ihr HTML, ihre Weiterleitungen
      und ihre JavaScript-Aufrufe selbst. Zuverlässiger als Umschreiben, und die
      Komprimierung bleibt erhalten. Wird automatisch erkannt.
  apps.description:
    name: Beschreibung
    description: Kurze Beschreibung auf der Karte angezeigt.
  apps.icon:
    name: Symbol
    description: Emoji-Symbol (z.B. 🚀).
  apps.logo:
    name: Logo
    description: Bild-URL (hat Vorrang vor Symbol).
  apps.category:
    name: Kategorie
    description: Gruppierungskategorie.
  apps.token:
    name: Token
    description: Authentifizierungs-Token (wird zur Query-String hinzugefügt).
  apps.rewrite:
    name: URL-Umschreibung
    description: URL-Umschreibung aktivieren (veraltet, auf App-Seite konfigurieren).
  apps.secret:
    name: Passwort
    description: >
      Passwort zum Zugriff auf diese Anwendung. Leer lassen, um den Passwortschutz zu deaktivieren.
  apps.admin:
    name: Nur Admins
    description: >
      Wenn aktiviert, ist diese Anwendung für Nicht-Administrator-Benutzer
      ausgeblendet.
  apps.preserve_path:
    name: Pfad beibehalten
    description: >
      Leitet Anfragen unverändert weiter, ohne das Proxy-Pfadpräfix zu entfernen.
      Erforderlich für HA-Ingress-Apps, die den vollständigen Pfad bereits in
      ihren URLs einbetten.
  apps.csrf_fix:
    name: CSRF-Korrektur
    description: >
      Für Django-Apps ohne HA-Ingress (z.B. NSPanel Manager), die über den
      multiappproxy-Ingress aufgerufen werden. Ersetzt die Header Origin,
      Referer und Host durch die Upstream-URL, damit die CSRF-Prüfung
      übereinstimmende Werte sieht.
  apps.ws_rewrite:
    name: WebSocket-Umschreibung
    description: >
      Injiziert ein Skript in HTML-Antworten, das window.WebSocket zur Laufzeit
      patcht: WebSocket-URLs werden umgeschrieben, damit sie über den Proxy-Pfad
      dieser App laufen (z.B. NSPanel Manager).
  apps.hassio_ingress_slug:
    name: HA-Ingress-Slug
    description: >
      Addon-Slug für Apps mit nativem HA-Ingress. Wenn gesetzt, löst
      multiappproxy das Ingress-Token des Addons über die Supervisor-API auf
      und schreibt diese Pfade um, damit der Browser über multiappproxy geht.
  apps.fast_upstream:
    name: Für dieses Backend optimieren
    description: >
      Aktivieren, wenn die Anwendung über den Proxy deutlich langsamer ist als
      im Direktzugriff: eingebettetes Gerät (ESP32, Firmware) oder moderne App
      mit großem JavaScript-Bundle. Aktiviert die Antwort-Pufferung wieder,
      damit die Sockets des Backends sofort freigegeben werden, lässt dessen
      Cache-Header durch, statt no-store zu erzwingen, und liefert statische
      Dateien (js, css, Schriften, Bilder, Audio) über eine eigene Location aus,
      die ihre Komprimierung erhält. Nicht aktivieren für Apps, die Antworten
      fortlaufend streamen (SSE, Live-Logs) — außer sie senden den Header
      X-Accel-Buffering: no, den nginx berücksichtigt.
  apps.autodetect:
    name: Automatische Erkennung
    description: >
      Prüft die Anwendung beim Start, um die beobachtbaren Optionen abzuleiten
      (Einstiegspunkt, CSP-Header, Origin-Prüfung). Was in der Konfiguration
      steht, hat immer Vorrang. Deaktivieren, um das Verhalten vollständig
      festzulegen.
  apps.ssl_verify:
    name: SSL-Prüfung
    description: >
      Prüft das SSL-Zertifikat des Upstreams (nur https) gegen die System-CAs.
      Standardmäßig deaktiviert, um selbstsignierte Zertifikate im lokalen
      Netzwerk zu akzeptieren.
  apps.ws_target:
    name: Separater WebSocket (URL)
    description: >
      URL des WebSocket-Servers, wenn das Gerät ihn auf einem anderen Port als
      HTTP bereitstellt (z.B. ESPSomfy-RTS: Web auf :80, WebSocket auf :8080 →
      http://192.168.1.223:8080). Der Proxy stellt ihn unter <Pfad>/ws bereit —
      aus einer HTTPS-Seite verbindet sich der Browser per wss:// über den
      Proxy, ohne Mixed-Content-Blockierung.
  apps.hide_csp:
    name: CSP-Header entfernen
    description: >
      Entfernt die von der Anwendung gesendeten Header Content-Security-Policy
      und X-Frame-Options. Aktivieren, wenn die App iframes verbietet
      (frame-ancestors 'none'), aber im HA-Ingress-Panel angezeigt werden soll
      (z.B. ESPSomfy-RTS). Betrifft nur diese App.
