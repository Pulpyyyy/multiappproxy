configuration:
  debug:
    name: Mode debug
    description: Afficher les logs en temps réel sur l'interface.
  autodetect:
    name: Détection automatique
    description: >
      Valeur par défaut de la détection automatique pour toutes les
      applications. Peut être surchargée application par application.
  apps:
    name: Applications
    description: Liste des applications à proxifier.
  # --- Identité / routage ---
  apps.name:
    name: Nom
    description: Nom d'affichage de l'application.
  apps.url:
    name: URL
    description: URL backend de l'application (http:// ou https://).
  apps.path:
    name: Chemin
    description: >
      Obsolète et ignoré : le chemin est calculé depuis le nom de l'application.
      Conservé uniquement pour que les anciennes configurations démarrent
      encore.
  apps.entry_path:
    name: Point d'entrée
    description: >
      Chemin interne sur lequel envoyer le navigateur à l'ouverture (ex.
      /ui/dashboard). Utile pour les apps qui répondent à leur racine par une
      redirection : l'ingress HA la suit lui-même, le navigateur reste sur le
      chemin du proxy, et les apps qui déduisent leur préfixe de l'URL se
      trompent. Détecté automatiquement dans la plupart des cas.
  apps.native_base_path:
    name: Préfixe géré par l'application
    description: >
      Quand l'application sait construire ses URLs à partir d'un en-tête de
      préfixe (X-Ingress-Path ou X-Forwarded-Prefix), le proxy le lui transmet
      et cesse toute réécriture : c'est l'application qui préfixe son HTML, ses
      redirections et ses appels JavaScript. Plus fiable qu'une réécriture, et
      la compression est conservée. Détecté automatiquement.
  # --- Affichage ---
  apps.description:
    name: Description
    description: Courte description affichée sur la carte.
  apps.icon:
    name: Icône
    description: Icône emoji (ex. 🚀).
  apps.logo:
    name: Logo
    description: URL d'une image (prioritaire sur l'icône).
  apps.category:
    name: Catégorie
    description: Catégorie de regroupement.
  # --- Accès ---
  apps.admin:
    name: Admins uniquement
    description: >
      Quand cette option est activée, l'application est masquée pour les
      utilisateurs non-administrateurs.
  apps.secret:
    name: Mot de passe
    description: >
      Mot de passe requis pour accéder à cette application. Laisser vide pour désactiver la protection par mot de passe.
  apps.token:
    name: Token
    description: Token d'authentification (ajouté en query string).
  # --- Comportement proxy ---
  apps.rewrite:
    name: Réécriture d'URL
    description: Activer la réécriture d'URL (obsolète, configurer côté app).
  apps.preserve_path:
    name: Conserver le chemin
    description: >
      Transfère les requêtes telles quelles sans supprimer le préfixe du chemin proxy.
      Nécessaire pour les apps ingress HA qui embarquent déjà le chemin complet dans leurs URLs.
  apps.csrf_fix:
    name: Correctif CSRF
    description: >
      À activer pour les applications qui vérifient l'origine des requêtes :
      apps Django sans ingress HA (ex. NSPanel Manager) ou firmwares embarqués
      (ex. ESPSomfy-RTS). Remplace les en-têtes Origin, Referer et Host par
      l'URL upstream afin que la vérification CSRF de l'application voie des
      valeurs cohérentes.
  apps.ws_rewrite:
    name: Réécriture WebSocket
    description: >
      Active la réécriture automatique des URLs WebSocket. Quand activé, un script
      est injecté dans les réponses HTML pour patcher window.WebSocket à l'exécution :
      toute URL WebSocket contenant /websocket/, /ws/ ou /wss/ est réécrite
      automatiquement pour passer par le chemin proxy de cette application.
      Nécessaire pour les apps dont le backend ou le JavaScript construit des URLs
      WebSocket avec le mauvais host ou chemin (ex. NSPanel Manager).
  apps.ws_target:
    name: WebSocket séparé (URL)
    description: >
      URL du serveur WebSocket quand l'appareil le sert sur un port différent
      du HTTP (ex. ESPSomfy-RTS : web sur :80, WebSocket sur :8080 →
      http://192.168.1.223:8080). Le proxy l'expose alors sur <chemin>/ws :
      depuis une page HTTPS le navigateur se connecte en wss:// via le proxy,
      ce qui évite le blocage "mixed content" d'un ws:// direct vers l'appareil.
  apps.hide_csp:
    name: Masquer les en-têtes CSP
    description: >
      Supprime les en-têtes Content-Security-Policy et X-Frame-Options renvoyés
      par l'application. À activer quand l'app interdit son affichage en iframe
      (frame-ancestors 'none') alors qu'elle doit s'afficher dans le panneau
      ingress de Home Assistant (ex. ESPSomfy-RTS). N'affecte que cette app.
  apps.fast_upstream:
    name: Optimiser pour ce backend
    description: >
      À activer quand l'application est nettement plus lente via le proxy qu'en
      accès direct : appareil embarqué (ESP32, firmware) ou application moderne
      servant un gros bundle JavaScript. Réactive la mise en tampon des réponses
      pour libérer immédiatement les sockets du backend, laisse passer ses
      en-têtes de cache au lieu de forcer no-store, et sert les fichiers
      statiques (js, css, polices, images, sons) via une location dédiée qui
      conserve leur compression. Ne pas activer pour les apps qui diffusent des
      réponses en continu (SSE, logs en direct), sauf si elles envoient
      l'en-tête X-Accel-Buffering: no, que nginx respecte.
  apps.autodetect:
    name: Détection automatique
    description: >
      Sonde l'application au démarrage pour déduire les options observables
      (point d'entrée, en-têtes CSP, contrôle d'origine). Ce qui est renseigné
      dans la configuration reste prioritaire. À désactiver pour figer
      entièrement le comportement.
  apps.ssl_verify:
    name: Vérification SSL
    description: >
      Vérifie le certificat SSL de l'application (upstreams https uniquement)
      contre les autorités de certification système. Désactivé par défaut pour
      accepter les certificats auto-signés du réseau local.
  # --- Avancé ---
  apps.hassio_ingress_slug:
    name: Slug ingress HA
    description: >
      Slug de l'addon pour les apps avec ingress HA natif. Quand défini,
      multiappproxy résout le token ingress de l'addon via l'API Supervisor
      et réécrit ces chemins pour que le navigateur passe par multiappproxy.
