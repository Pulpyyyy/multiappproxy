configuration:
  debug:
    name: Modalità debug
    description: Visualizza i log in tempo reale sull'interfaccia.
  autodetect:
    name: Rilevamento automatico
    description: >
      Valore predefinito del rilevamento automatico per tutte le applicazioni.
      Sovrascrivibile per singola applicazione.
  apps:
    name: Applicazioni
    description: Elenco delle applicazioni da proxy.
  apps.name:
    name: Nome
    description: Nome visualizzato dell'applicazione.
  apps.url:
    name: URL
    description: URL backend dell'applicazione (http:// o https://).
  apps.path:
    name: Percorso
    description: >
      Obsoleto e ignorato: il percorso è derivato dal nome dell'applicazione.
      Mantenuto solo perché le vecchie configurazioni continuino ad avviarsi.
  apps.entry_path:
    name: Punto di ingresso
    description: >
      Percorso interno a cui inviare il browser all'apertura (es.
      /ui/dashboard). Utile per le app che rispondono alla propria radice con un
      redirect: l'ingress di HA lo segue da solo, il browser resta sul percorso
      del proxy e le app che deducono il prefisso dall'URL sbagliano. Rilevato
      automaticamente nella maggior parte dei casi.
  apps.native_base_path:
    name: Prefisso gestito dall'applicazione
    description: >
      Quando l'applicazione sa costruire i suoi URL da un header di prefisso
      (X-Ingress-Path o X-Forwarded-Prefix), il proxy glielo inoltra e smette di
      riscrivere qualsiasi cosa: è l'app a prefissare il proprio HTML, i
      redirect e le chiamate JavaScript. Più affidabile della riscrittura, e la
      compressione viene preservata. Rilevato automaticamente.
  apps.description:
    name: Descrizione
    description: Breve descrizione visualizzata sulla scheda.
  apps.icon:
    name: Icona
    description: Icona emoji (es. 🚀).
  apps.logo:
    name: Logo
    description: URL dell'immagine (ha priorità sull'icona).
  apps.category:
    name: Categoria
    description: Categoria di raggruppamento.
  apps.token:
    name: Token
    description: Token di autenticazione (aggiunto alla query string).
  apps.rewrite:
    name: Riscrittura URL
    description: Abilita riscrittura URL (obsoleto, configurare lato app).
  apps.secret:
    name: Password
    description: >
      Password richiesta per accedere a questa applicazione. Lasciare vuoto per disabilitare la protezione con password.
  apps.admin:
    name: Solo admin
    description: >
      Quando attivato, questa applicazione è nascosta agli utenti non
      amministratori.
  apps.preserve_path:
    name: Mantieni percorso
    description: >
      Inoltra le richieste così come sono, senza rimuovere il prefisso del
      percorso proxy. Necessario per le app con ingress HA nativo che includono
      già il percorso completo nei loro URL.
  apps.csrf_fix:
    name: Correzione CSRF
    description: >
      Da attivare per le app Django senza ingress HA (es. NSPanel Manager)
      accessibili tramite l'ingress di multiappproxy. Sostituisce le
      intestazioni Origin, Referer e Host con l'URL upstream affinché il
      controllo CSRF veda valori corrispondenti.
  apps.ws_rewrite:
    name: Riscrittura WebSocket
    description: >
      Inietta uno script nelle risposte HTML che applica una patch a
      window.WebSocket a runtime: gli URL WebSocket vengono riscritti per
      passare dal percorso proxy di questa app (es. NSPanel Manager).
  apps.hassio_ingress_slug:
    name: Slug ingress HA
    description: >
      Slug dell'addon per le app con ingress HA nativo. Quando impostato,
      multiappproxy risolve il token ingress dell'addon tramite l'API del
      Supervisor e riscrive quei percorsi affinché il browser passi da
      multiappproxy.
  apps.fast_upstream:
    name: Ottimizza per questo backend
    description: >
      Da attivare quando l'applicazione è nettamente più lenta tramite il proxy
      rispetto all'accesso diretto: dispositivo embedded (ESP32, firmware) o
      applicazione moderna che serve un grosso bundle JavaScript. Riattiva il
      buffering delle risposte per liberare subito i socket del backend, lascia
      passare i suoi header di cache invece di forzare no-store e serve i file
      statici (js, css, font, immagini, audio) da una location dedicata che ne
      conserva la compressione. Non attivare per app che trasmettono risposte in
      streaming (SSE, log in tempo reale), a meno che non inviino l'header
      X-Accel-Buffering: no, che nginx rispetta.
  apps.autodetect:
    name: Rilevamento automatico
    description: >
      Sonda l'applicazione all'avvio per dedurre le opzioni osservabili (punto
      di ingresso, header CSP, controllo dell'origine). Quanto indicato nella
      configurazione ha sempre la precedenza. Disattiva per fissare
      completamente il comportamento.
  apps.ssl_verify:
    name: Verifica SSL
    description: >
      Verifica il certificato SSL dell'upstream (solo https) contro le CA di
      sistema. Disattivato per impostazione predefinita per accettare
      certificati autofirmati della rete locale.
  apps.ws_target:
    name: WebSocket separato (URL)
    description: >
      URL del server WebSocket quando il dispositivo lo serve su una porta
      diversa dall'HTTP (es. ESPSomfy-RTS: web su :80, WebSocket su :8080 →
      http://192.168.1.223:8080). Il proxy lo espone su <percorso>/ws — da una
      pagina HTTPS il browser si connette in wss:// tramite il proxy, evitando
      il blocco del contenuto misto.
  apps.hide_csp:
    name: Nascondi intestazioni CSP
    description: >
      Rimuove le intestazioni Content-Security-Policy e X-Frame-Options
      restituite dall'applicazione. Da attivare quando l'app vieta la
      visualizzazione in iframe (frame-ancestors 'none') ma deve essere
      mostrata nel pannello ingress di Home Assistant (es. ESPSomfy-RTS).
      Riguarda solo questa app.
