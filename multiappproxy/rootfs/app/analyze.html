<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-App Proxy</title>
    <style>
        /* Same variables and fallbacks as index.html: inside the ingress iframe the
           HA theme does not reach us, so the fallbacks are what actually renders and
           the two pages have to agree on them. */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: var(--primary-background-color, #111);
            color: var(--primary-text-color, #e1e1e1);
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

        header { display: flex; flex-direction: column; gap: .4rem; }
        .back { color: var(--secondary-text-color, #9b9b9b); text-decoration: none; font-size: .9rem; }
        .back:hover { color: var(--primary-color, #03a9f4); }
        h1 { font-size: 2rem; font-weight: 300; color: var(--primary-color, #03a9f4); }
        .lede { color: var(--secondary-text-color, #9b9b9b); max-width: 62ch; }

        .panel {
            background: var(--card-background-color, #1c1c1c);
            border: 1px solid var(--divider-color, #2c2c2c);
            border-radius: 12px;
        }
        .panel-pad { padding: 1.25rem; }
        .panel-head {
            display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
            padding: .9rem 1.25rem; border-bottom: 1px solid var(--divider-color, #2c2c2c);
        }
        .panel-title {
            font-size: .8rem; letter-spacing: .07em; text-transform: uppercase;
            color: var(--secondary-text-color, #9b9b9b); font-weight: 500;
        }

        .query { display: flex; gap: .75rem; flex-wrap: wrap; align-items: flex-end; }
        .field { flex: 1 1 22rem; display: flex; flex-direction: column; gap: .4rem; }
        label { font-size: .85rem; color: var(--secondary-text-color, #9b9b9b); }
        input[type="url"] {
            width: 100%;
            background: var(--primary-background-color, #111);
            border: 1px solid var(--divider-color, #2c2c2c);
            border-radius: 8px;
            padding: .75rem 1rem;
            color: var(--primary-text-color, #e1e1e1);
            font-family: monospace; font-size: .95rem;
            outline: none; transition: border-color .2s;
        }
        input[type="url"]:focus { border-color: var(--primary-color, #03a9f4); }

        button {
            font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid transparent;
            padding: .75rem 1.5rem; transition: opacity .2s, border-color .2s;
        }
        button:focus-visible { outline: 2px solid var(--primary-color, #03a9f4); outline-offset: 2px; }
        .btn-primary { background: var(--primary-color, #03a9f4); color: #fff; }
        .btn-primary:hover { opacity: .85; }
        .btn-primary:disabled { opacity: .5; cursor: default; }
        .btn-ghost {
            background: transparent; color: var(--secondary-text-color, #9b9b9b);
            border-color: var(--divider-color, #2c2c2c); padding: .35rem .8rem; font-size: .85rem;
        }
        .btn-ghost:hover { border-color: var(--primary-color, #03a9f4); color: var(--primary-text-color, #e1e1e1); }

        .probe { display: flex; flex-direction: column; gap: .3rem; font-family: monospace; font-size: .85rem; }
        .probe-step { display: flex; gap: .6rem; color: var(--secondary-text-color, #9b9b9b); }
        .probe-mark { color: var(--primary-color, #03a9f4); width: 1rem; flex: none; }
        .probe-detail { opacity: .65; }

        .verdict { display: flex; padding: 1.15rem 1.25rem; border-left: 3px solid var(--tone, #03a9f4); }
        .verdict-body { display: flex; flex-direction: column; gap: .35rem; }
        .verdict h2 { font-size: 1.15rem; font-weight: 500; }
        .verdict p { color: var(--secondary-text-color, #9b9b9b); max-width: 62ch; }
        .pill {
            align-self: flex-start; font-size: .72rem; font-weight: 700;
            letter-spacing: .06em; text-transform: uppercase;
            padding: .2rem .6rem; border-radius: 999px;
            color: var(--tone, #03a9f4); border: 1px solid var(--tone, #03a9f4);
        }
        .tone-ok   { --tone: #4caf50; }
        .tone-warn { --tone: #ffa726; }
        .tone-stop { --tone: var(--error-color, #db4437); }

        .findings { list-style: none; }
        .findings li {
            display: flex; flex-direction: column; gap: .35rem;
            padding: .95rem 1.25rem; border-top: 1px solid var(--divider-color, #2c2c2c);
        }
        .findings li:first-child { border-top: none; }
        .finding-head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
        .tag {
            font-family: monospace; font-size: .8rem; padding: .1rem .45rem; border-radius: 5px;
            background: var(--primary-background-color, #111);
            border: 1px solid var(--divider-color, #2c2c2c);
            color: var(--primary-color, #03a9f4);
        }
        .evidence {
            font-family: monospace; font-size: .8rem; color: var(--secondary-text-color, #9b9b9b);
            background: var(--primary-background-color, #111);
            border: 1px solid var(--divider-color, #2c2c2c);
            border-radius: 6px; padding: .5rem .65rem; overflow-x: auto; white-space: pre;
        }

        pre {
            padding: 1.1rem 1.25rem; overflow-x: auto;
            font-family: monospace; font-size: .88rem; line-height: 1.7;
        }
        pre .c { color: var(--secondary-text-color, #9b9b9b); }

        .note {
            padding: .95rem 1.25rem; border-top: 1px solid var(--divider-color, #2c2c2c);
            color: var(--secondary-text-color, #9b9b9b); font-size: .88rem;
        }
        .note strong { color: var(--primary-text-color, #e1e1e1); font-weight: 500; }
        .note code { font-family: monospace; font-size: .85rem; color: var(--primary-color, #03a9f4); }
        .note p + p { margin-top: .5rem; }

        .message { padding: 1rem 1.25rem; border-radius: 8px; }
        .message.error { background: var(--error-color, #db4437); color: #fff; }
        .hidden { display: none; }
        footer {
            text-align: center; margin-top: 1rem; padding-top: 1.5rem;
            border-top: 1px solid var(--divider-color, #2c2c2c);
            color: var(--secondary-text-color, #9b9b9b); font-size: .9rem;
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
    <script src="./i18n.js"></script>
</head>
<body>
<div class="container">
    <header>
        <a class="back" href="./" id="t-back"></a>
        <h1 id="t-title"></h1>
        <p class="lede" id="t-lede"></p>
    </header>

    <div id="denied" class="message error hidden"></div>

    <section class="panel panel-pad hidden" id="form">
        <div class="query">
            <div class="field">
                <label for="url" id="t-label"></label>
                <input type="url" id="url" placeholder="http://192.168.1.50:8080" spellcheck="false">
            </div>
            <button class="btn-primary" id="run"></button>
        </div>
    </section>

    <section class="panel panel-pad hidden" id="probing" aria-live="polite">
        <div class="probe" id="probe-log"></div>
    </section>

    <div id="failed" class="message error hidden"></div>

    <div id="result" class="hidden" style="display:none;flex-direction:column;gap:1.5rem;" aria-live="polite">
        <section class="panel">
            <div class="verdict" id="verdict">
                <div class="verdict-body">
                    <span class="pill" id="verdict-pill"></span>
                    <h2 id="verdict-title"></h2>
                    <p id="verdict-text"></p>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head"><span class="panel-title" id="t-saw"></span></div>
            <ul class="findings" id="findings"></ul>
        </section>

        <section class="panel">
            <div class="panel-head">
                <span class="panel-title" id="t-start"></span>
                <button class="btn-ghost" id="copy"></button>
            </div>
            <pre id="yaml"></pre>
            <div class="note" id="manual"></div>
        </section>
    </div>

    <footer>🚀 Multi-App Proxy</footer>
</div>

<script>
    const $ = (id) => document.getElementById(id);
    const T = window.mapT;
    const M = window.mapMsg;

    // The page is served at {base}/analyze, so the portal root is one segment up.
    const basePath = window.location.pathname.replace(/\/analyze\/?$/, '');
    const api = (route) => (basePath ? basePath + route : route);

    document.documentElement.lang = window.MAP_LANG;
    document.title = T('page.title') + ' — Multi-App Proxy';
    $('t-back').textContent = '← ' + T('page.back');
    $('t-title').textContent = T('page.title');
    $('t-lede').textContent = T('page.lede');
    $('denied').textContent = T('page.denied');
    $('t-label').textContent = T('page.label');
    $('run').textContent = T('page.button');
    $('t-saw').textContent = T('panel.saw');
    $('t-start').textContent = T('panel.start');
    $('copy').textContent = T('btn.copy');

    const RUNNING_STEPS = ['run.1', 'run.2', 'run.3', 'run.4', 'run.5'];

    function renderRunning() {
        $('probe-log').innerHTML = RUNNING_STEPS.map((key) =>
            '<div class="probe-step"><span class="probe-mark">›</span><span>' +
            esc(T(key)) + '</span></div>').join('');
    }

    function renderProbe(steps) {
        $('probe-log').innerHTML = steps.map((s) =>
            '<div class="probe-step"><span class="probe-mark">' + (s.ok ? '✓' : '✗') + '</span>' +
            '<span>' + esc(M(s.step)) +
            ' <span class="probe-detail">(' + esc(M(s.detail)) + ')</span></span></div>').join('');
    }

    /* An emoji takes two columns in a monospace block but counts as one character,
       so aligning the comments on length alone would leave the column ragged. */
    function displayWidth(text) {
        let width = 0;
        for (const ch of text) {
            const cp = ch.codePointAt(0);
            const wide = (cp >= 0x1100 && cp <= 0x115F) || cp === 0x2329 || cp === 0x232A ||
                (cp >= 0x2E80 && cp <= 0xA4CF) || (cp >= 0xAC00 && cp <= 0xD7A3) ||
                (cp >= 0xF900 && cp <= 0xFAFF) || (cp >= 0xFE30 && cp <= 0xFE6F) ||
                (cp >= 0xFF00 && cp <= 0xFF60) || (cp >= 0xFFE0 && cp <= 0xFFE6) ||
                (cp >= 0x1F300 && cp <= 0x1FAFF) || (cp >= 0x20000 && cp <= 0x3FFFD);
            width += wide ? 2 : 1;
        }
        return width;
    }

    function buildYaml(data) {
        const body = data.entries.map((entry, i) => ({
            code: (i === 0 ? '- ' : '  ') + entry.key + ': ' + entry.value,
            comment: M(entry.comment)
        }));
        const column = Math.max.apply(null, body.map((row) => displayWidth(row.code)));
        const lines = M(data.header).split('\n').map((line) => ({ code: line, comment: '' }));
        body.forEach((row) => lines.push(row));

        return lines.map((row) => {
            if (!row.comment) { return '<span class="c">' + esc(row.code) + '</span>'; }
            const pad = ' '.repeat(Math.max(1, column - displayWidth(row.code) + 2));
            return esc(row.code) + '<span class="c">' + esc(pad + '# ' + row.comment) + '</span>';
        }).join('\n');
    }

    async function run() {
        const url = $('url').value.trim();
        if (!url) { return; }
        $('run').disabled = true;
        $('result').classList.add('hidden');
        $('result').style.display = 'none';
        $('failed').classList.add('hidden');
        $('probing').classList.remove('hidden');
        renderRunning();

        let data;
        try {
            const res = await fetch(api('/api/analyze'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            data = await res.json();
        } catch (e) {
            data = { ok: false, error: { id: 'error.fetch', params: { msg: e.message } } };
        }
        $('run').disabled = false;

        if (data.probe && data.probe.length) {
            renderProbe(data.probe);
        } else {
            $('probing').classList.add('hidden');
        }

        if (!data.ok) {
            $('failed').textContent = data.error ? M(data.error) : T('error.generic');
            $('failed').classList.remove('hidden');
            return;
        }
        render(data);
    }

    function render(data) {
        $('verdict').className = 'verdict tone-' + data.verdict.tone;
        $('verdict-pill').textContent = M(data.verdict.pill);
        $('verdict-title').textContent = M(data.verdict.title);
        $('verdict-text').textContent = M(data.verdict.text);

        $('findings').innerHTML = data.findings.map((f) => {
            const tag = M(f.tag);
            const label = (f.value === null || f.value === undefined) ? tag : tag + ': ' + f.value;
            return '<li><div class="finding-head"><code class="tag">' + esc(label) + '</code>' +
                   '<span>' + esc(M(f.claim)) + '</span></div>' +
                   '<div class="evidence">' + esc(f.evidence) + '</div></li>';
        }).join('');

        $('yaml').innerHTML = buildYaml(data);
        // The notes carry their own emphasis and code markup, so they go in as HTML.
        $('manual').innerHTML = data.manual.map((note) => '<p>' + M(note) + '</p>').join('');

        $('result').classList.remove('hidden');
        $('result').style.display = 'flex';
    }

    $('copy').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText($('yaml').innerText); } catch (e) { /* not available */ }
        $('copy').textContent = T('btn.copied');
        setTimeout(() => ($('copy').textContent = T('btn.copy')), 1400);
    });
    $('run').addEventListener('click', run);
    $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') { run(); } });

    function esc(s) {
        return String(s === null || s === undefined ? '' : s)
            .replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    }

    // The API refuses non-admins anyway; asking first is only so the page says why
    // instead of failing on the first click.
    (async () => {
        try {
            const res = await fetch(api('/api/user'));
            const user = res.ok ? await res.json() : {};
            if (user.is_admin === true) {
                $('form').classList.remove('hidden');
                $('url').focus();
                return;
            }
        } catch (e) { /* fall through to the refusal below */ }
        $('denied').classList.remove('hidden');
    })();
</script>
</body>
</html>
